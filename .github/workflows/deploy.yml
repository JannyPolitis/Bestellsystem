name: Deploy Pizza Bestellsystem

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  build-frontend:
    name: Frontend-Build
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    name: Deploy auf VServer
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: SSH-Key laden
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VSERVER_SSH_KEY }}

      - name: Server als bekannten Host hinterlegen
        run: ssh-keyscan -p "${{ secrets.VSERVER_PORT }}" -H "${{ secrets.VSERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Backend synchronisieren (ohne .env, DB, node_modules)
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude '*.db' \
            --exclude '*.db-journal' \
            --exclude '*.db-wal' \
            --exclude '*.db-shm' \
            --exclude 'node_modules' \
            -e "ssh -p ${{ secrets.VSERVER_PORT }}" \
            backend/ "${{ secrets.VSERVER_USER }}@${{ secrets.VSERVER_HOST }}:${{ secrets.VSERVER_BACKEND_PATH }}/"

      - name: Frontend-Build synchronisieren
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.VSERVER_PORT }}" \
            frontend/dist/ "${{ secrets.VSERVER_USER }}@${{ secrets.VSERVER_HOST }}:${{ secrets.VSERVER_FRONTEND_PATH }}/"

      - name: Backend-Dependencies installieren & PM2 neu laden
        run: |
          ssh -p "${{ secrets.VSERVER_PORT }}" "${{ secrets.VSERVER_USER }}@${{ secrets.VSERVER_HOST }}" '
            set -e
            cd "${{ secrets.VSERVER_BACKEND_PATH }}"
            npm ci --omit=dev
            pm2 reload "${{ secrets.PM2_APP_NAME }}" --update-env || pm2 start server.js --name "${{ secrets.PM2_APP_NAME }}"
            pm2 save
          '
